<title>The Wall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ──────────────────────────────────────────────────────────────
   Not a page. A wall you stand in front of and walk around.
   Forty-odd objects at wildly different scales, overlapping,
   held in one space. Drag to move, scroll to zoom, click to
   walk up to something. Every surface is a material — layered
   gradient, grain, edge light, cast shadow — never a flat fill.
   Reserved plates are finished surfaces waiting for photographs,
   not wireframe boxes.
   ────────────────────────────────────────────────────────────── */
:root{
  --ink:#0B0B0C;
  --void:#070708;
  --paper:#F3F1EB;
  --red:#F0220E;
  --rust:#E2673C;
  --ash:#7E7A74;

  --g:"Archivo","Helvetica Neue",Arial,sans-serif;
  --s:"Instrument Serif",Georgia,serif;
  --m:"JetBrains Mono",ui-monospace,Menlo,monospace;

  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--paper);
  font-family:var(--g);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

/* ambient light behind the wall, so the room has depth */
.room{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(90% 65% at 24% 18%,rgba(240,34,14,.16),transparent 62%),
    radial-gradient(80% 60% at 82% 76%,rgba(226,103,60,.13),transparent 64%),
    radial-gradient(120% 95% at 50% 50%,transparent 38%,rgba(0,0,0,.72) 100%);
}
.vig{position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 50%,transparent 52%,rgba(0,0,0,.6) 100%)}
.grain{position:fixed;inset:0;z-index:41;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.8'/></svg>")}

/* ═══ the viewport and the world ═══ */
.stage{position:fixed;inset:0;z-index:10;cursor:grab;touch-action:none}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

/* ═══ surfaces — every object is a material ═══ */
.o{
  position:absolute;overflow:hidden;
  box-shadow:0 44px 90px -26px rgba(0,0,0,.78), 0 6px 18px -8px rgba(0,0,0,.5);
  transition:box-shadow .45s cubic-bezier(.2,.8,.3,1), filter .45s;
}
.o::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:9;opacity:.3;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.75'/></svg>");
}
.o--click{cursor:pointer}
.o--click:hover{box-shadow:0 60px 120px -28px rgba(0,0,0,.85), 0 0 0 1px rgba(243,241,235,.22)}

.s-paper{background:linear-gradient(157deg,#FBF9F4 0%,#F1EEE6 48%,#E4E0D6 100%);color:var(--ink)}
.s-paper::before{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.08)}
.s-ink{background:linear-gradient(157deg,#1E1E20 0%,#121213 46%,#09090A 100%);color:var(--paper)}
.s-ink::before{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.045)}
.s-red{background:radial-gradient(128% 96% at 28% 16%,#FF6A4A 0%,#F0220E 44%,#9E0F03 100%);color:#FFF4F1}
.s-red::before{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,220,210,.4)}
.s-rust{background:radial-gradient(120% 92% at 30% 18%,#F2A070 0%,#E2673C 46%,#9E3A14 100%);color:#1A0E08}
.s-glass{background:linear-gradient(157deg,rgba(243,241,235,.09),rgba(243,241,235,.03));
  backdrop-filter:blur(10px);color:var(--paper);box-shadow:0 30px 70px -26px rgba(0,0,0,.7), inset 0 0 0 1px rgba(243,241,235,.16)}

/* type inside objects */
.pad{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,1.4vw,26px)}
.k{font-family:var(--m);font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.62}
.k--b{opacity:1}
.tn{font-variant-numeric:tabular-nums}

.t-hero{font-weight:900;letter-spacing:-.058em;line-height:.74;text-transform:uppercase}
.t-big{font-weight:900;letter-spacing:-.052em;line-height:.8;text-transform:uppercase}
.t-num{font-weight:200;letter-spacing:-.06em;line-height:.72;font-variant-numeric:tabular-nums}
.t-ser{font-family:var(--s);font-weight:400;line-height:.98;letter-spacing:-.022em}
.t-ser i{font-style:italic}
.t-body{font-family:var(--m);font-size:12px;line-height:1.85;opacity:.78}
.t-body b{opacity:1;font-weight:500}

.rep{display:flex;flex-direction:column;justify-content:center;gap:.01em;height:100%}
.rep b{font-weight:900;letter-spacing:-.05em;line-height:.9;text-transform:uppercase;white-space:nowrap;display:block}
.rep b:nth-child(even){opacity:.24}
.rot{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;letter-spacing:-.045em;text-transform:uppercase;line-height:1}

/* reserved plates — finished surfaces, not wireframes */
.s-plate{background:
    radial-gradient(76% 56% at 30% 24%,rgba(255,186,138,.34),transparent 64%),
    linear-gradient(158deg,#2A1A14 0%,#140C0A 52%,#080505 100%);color:#F3EDE6}
.s-plate .k{opacity:.5}
.s-plate--cool{background:
    radial-gradient(76% 56% at 32% 26%,rgba(176,196,226,.26),transparent 64%),
    linear-gradient(158deg,#1A1D24 0%,#101216 52%,#07080A 100%)}
.plate__rule{position:absolute;left:0;right:0;bottom:38%;height:1px;background:linear-gradient(90deg,transparent,rgba(243,237,230,.3),transparent);z-index:6}

/* index object scrolls internally */
.idx{position:absolute;inset:0;z-index:5;padding:clamp(16px,1.5vw,28px);display:flex;flex-direction:column}
.idx__h{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}
.idx__rows{flex:1;overflow:auto;border-top:1px solid rgba(11,11,12,.16)}
.ir{display:grid;grid-template-columns:3ch 1fr auto;gap:12px;align-items:baseline;padding-block:9px;
  border-bottom:1px solid rgba(11,11,12,.1);font-family:var(--m);font-size:10.5px;color:#6E6A64}
.ir b{font-family:var(--g);font-weight:800;font-size:15px;letter-spacing:-.03em;color:var(--ink);text-transform:uppercase}
.ir--f b,.ir--f span{color:var(--red)}

/* ═══ chrome ═══ */
.ui{position:fixed;z-index:50;pointer-events:none;font-family:var(--m);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.ui *{pointer-events:auto}
.ui--tl{top:calc(env(safe-area-inset-top,0px) + 18px);left:max(18px,env(safe-area-inset-left,0px))}
.ui--tr{top:calc(env(safe-area-inset-top,0px) + 18px);right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:7px}
.ui--bl{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:max(18px,env(safe-area-inset-left,0px));color:var(--ash)}
.ui--br{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:7px}
.btn{font:inherit;letter-spacing:.18em;text-transform:uppercase;color:var(--paper);
  background:rgba(243,241,235,.06);border:1px solid rgba(243,241,235,.18);backdrop-filter:blur(10px);
  padding:9px 14px;cursor:pointer;transition:background .22s,color .22s,border-color .22s}
.btn:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn--sq{width:38px;padding:9px 0;text-align:center}

.name{font-weight:800;font-size:13px;letter-spacing:-.01em;text-transform:none;color:var(--paper)}
.hint{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);
  font-family:var(--m);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);
  background:rgba(7,7,8,.6);backdrop-filter:blur(10px);padding:9px 16px;border:1px solid rgba(243,241,235,.12);
  transition:opacity .6s;white-space:nowrap}
.hint.gone{opacity:0;pointer-events:none}
@media (max-width:640px){.ui--bl{display:none}.hint{font-size:9px;letter-spacing:.14em;padding:8px 12px}}

/* focus veil */
.veil{position:fixed;inset:0;z-index:30;background:rgba(7,7,8,.72);opacity:0;pointer-events:none;transition:opacity .5s}
.veil.on{opacity:1;pointer-events:auto}
.o.lift{z-index:35!important;box-shadow:0 80px 160px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(243,241,235,.26)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>

<div class="room" aria-hidden="true"></div>

<div class="stage" id="stage">
  <div class="world" id="world"></div>
</div>

<div class="veil" id="veil" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="ui ui--tl"><span class="name">Ashish Narayan</span></div>
<div class="ui ui--tr">
  <button class="btn" id="bAll" type="button">Overview</button>
  <button class="btn btn--sq" id="bOut" type="button">&minus;</button>
  <button class="btn btn--sq" id="bIn" type="button">+</button>
</div>
<div class="ui ui--bl"><span id="coord">14 entries &middot; 02 failed &middot; est. 2019</span></div>
<div class="ui ui--br"><span class="btn" style="cursor:default" id="zoom">100%</span></div>
<div class="hint" id="hint">Drag to move &middot; scroll to zoom &middot; click a plate</div>

<script>
(function () {
  "use strict";

  var W = 5600, H = 3700;               // world size
  var world = document.getElementById("world");
  var stage = document.getElementById("stage");
  world.style.width = W + "px";
  world.style.height = H + "px";

  var WORK = [
    { n:1,  t:"Savison Life",            m:"Companies",  y:2025, s:"Running" },
    { n:2,  t:"Rikencare",               m:"Code",       y:2025, s:"Shipped" },
    { n:3,  t:"Indizilla",               m:"Code",       y:2024, s:"Running" },
    { n:4,  t:"GetPharm",                m:"Companies",  y:2025, s:"Running" },
    { n:5,  t:"Betta Beaut",             m:"Companies",  y:2023, s:"Failed"  },
    { n:6,  t:"Nirmal Kaya",             m:"Companies",  y:2024, s:"Paused"  },
    { n:7,  t:"Performance Realty",      m:"Companies",  y:2026, s:"Running" },
    { n:8,  t:"Slab Desk",               m:"Wood",       y:2021, s:"Shipped" },
    { n:9,  t:"Mortise Bench",           m:"Wood",       y:2020, s:"Shipped" },
    { n:10, t:"Folding Wall Table",      m:"Wood",       y:2022, s:"Failed"  },
    { n:11, t:"Systems Thinking",        m:"Classrooms", y:2023, s:"Shipped" },
    { n:12, t:"Build-in-Public Clinic",  m:"Classrooms", y:2024, s:"Running" },
    { n:13, t:"The Monthly Review",      m:"Classrooms", y:2026, s:"Running" },
    { n:14, t:"Field Kit",               m:"Code",       y:2025, s:"Shipped" }
  ];
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  /* ── the composition. Hand-placed, deliberately uneven. ── */
  var OBJ = [
    /* opening cluster */
    { x:300,  y:980,  w:1540, h:720, s:"ink", k:"Thesis", kind:"hero" },
    { x:1900, y:980,  w:620,  h:720, s:"paper", k:"The method", kind:"body" },
    { x:300,  y:1760, w:1060, h:300, s:"red", k:"", kind:"strip" },
    { x:1420, y:1760, w:420,  h:300, s:"glass", k:"Since", kind:"stat", a:"07", b:"years on record" },
    { x:1900, y:1760, w:620,  h:560, s:"plate", k:"Reserved &mdash; portrait", kind:"plate" },

    /* name, enormous, set behind everything */
    { x:260,  y:300,  w:2260, h:560, s:"none", kind:"name" },

    /* wood cluster, upper right */
    { x:2760, y:260,  w:300,  h:300, s:"rust", k:"Material 01", kind:"mat", a:"Wood" },
    { x:3120, y:260,  w:680,  h:880, s:"paper", kind:"poster", i:8,  lay:"stack" },
    { x:3860, y:260,  w:420,  h:540, s:"ink",   kind:"poster", i:9,  lay:"rot" },
    { x:3860, y:860,  w:420,  h:280, s:"glass", k:"Entries", kind:"stat", a:"03", b:"in wood" },
    { x:4340, y:260,  w:900,  h:600, s:"plate", k:"Reserved &mdash; bench, raking light", kind:"plate" },
    { x:2760, y:620,  w:300,  h:520, s:"red",   kind:"poster", i:10, lay:"num" },

    /* code cluster, lower left */
    { x:300,  y:2360, w:760,  h:960, s:"ink",   kind:"poster", i:3,  lay:"rep" },
    { x:1120, y:2360, w:560,  h:620, s:"paper", kind:"poster", i:2,  lay:"ser" },
    { x:1120, y:3040, w:560,  h:280, s:"glass", k:"Material 02", kind:"mat", a:"Code" },
    { x:1740, y:2360, w:780,  h:460, s:"plate", k:"Reserved &mdash; night desk", kind:"plateCool" },
    { x:1740, y:2880, w:380,  h:440, s:"rust",  kind:"poster", i:14, lay:"crop" },
    { x:2180, y:2880, w:340,  h:440, s:"paper", kind:"poster", i:1,  lay:"split" },

    /* the index, centre-right */
    { x:2600, y:1340, w:1180, h:1180, s:"paper", kind:"index" },

    /* classrooms, right */
    { x:3860, y:1340, w:620,  h:760, s:"ink",   kind:"poster", i:11, lay:"stack" },
    { x:4540, y:1340, w:700,  h:360, s:"rust",  kind:"mat", k:"Material 03", a:"Classrooms" },
    { x:4540, y:1760, w:700,  h:340, s:"paper", kind:"poster", i:12, lay:"crop" },
    { x:3860, y:2160, w:1380, h:620, s:"plate", k:"Reserved &mdash; hands, mid-cut", kind:"plate" },
    { x:4540, y:2840, w:700,  h:480, s:"ink",   kind:"poster", i:13, lay:"rot" },
    { x:3860, y:2840, w:620,  h:480, s:"glass", k:"Still running", kind:"stat", a:"06", b:"of fourteen" },

    /* failure cluster — the loudest corner */
    { x:2600, y:2600, w:1180, h:720, s:"red", kind:"fail" },
    { x:2600, y:3380, w:560,  h:240, s:"ink", kind:"poster", i:5, lay:"crop" },
    { x:3220, y:3380, w:560,  h:240, s:"red", kind:"poster", i:10, lay:"split" },

    /* companies, far left lower */
    { x:300,  y:3380, w:760,  h:240, s:"glass", k:"Material 04", kind:"mat", a:"Companies" },
    { x:1120, y:3380, w:400,  h:240, s:"paper", kind:"poster", i:4, lay:"num" },
    { x:1580, y:3380, w:400,  h:240, s:"ink",   kind:"poster", i:7, lay:"num" },

    /* small marks scattered as punctuation */
    { x:2600, y:260,  w:120,  h:120, s:"paper", kind:"mark", a:"&#9679;" },
    { x:2600, y:900,  w:120,  h:200, s:"ink",   kind:"mark", a:"&#8599;" },
    { x:5300, y:1340, w:180,  h:180, s:"red",   kind:"mark", a:"&#10033;" },
    { x:200,  y:2180, w:160,  h:120, s:"glass", kind:"chip", a:"00 01&ndash;071" },
    { x:2560, y:2420, w:220,  h:120, s:"glass", kind:"chip", a:"236.095" },
    { x:5300, y:2840, w:200,  h:120, s:"glass", kind:"chip", a:"12.5" },
    { x:1700, y:200,  w:200,  h:120, s:"glass", kind:"chip", a:"30.73&deg;N" },

    /* contact, far right */
    { x:4540, y:3380, w:700,  h:240, s:"red",  kind:"contact" }
  ];

  function wk(i){ return WORK[i - 1]; }

  function posterHTML(o) {
    var p = wk(o.i), words = p.t.split(" "), body = "";
    var scale = Math.min(o.w, o.h);

    if (o.lay === "stack") {
      body = "<div class='t-big' style='font-size:" + (scale * 0.17).toFixed(0) + "px'>" +
             words.map(function (w) { return "<div>" + w + "</div>"; }).join("") + "</div>";
    } else if (o.lay === "rep") {
      var r = "";
      for (var k = 0; k < 10; k++) r += "<b style='font-size:" + (scale * 0.13).toFixed(0) + "px'>" + words[0] + "</b>";
      body = "<div class='rep'>" + r + "</div>";
    } else if (o.lay === "num") {
      body = "<div class='t-num' style='font-size:" + (scale * 0.62).toFixed(0) + "px'>" + pad(p.n) + "</div>";
    } else if (o.lay === "rot") {
      body = "<div class='rot' style='font-size:" + (scale * 0.2).toFixed(0) + "px'>" + p.t + "</div>";
    } else if (o.lay === "crop") {
      body = "<div class='t-big' style='font-size:" + (scale * 0.46).toFixed(0) + "px;white-space:nowrap;margin-left:-.06em'>" + words[0] + "</div>";
    } else if (o.lay === "ser") {
      body = "<div class='t-ser' style='font-size:" + (scale * 0.21).toFixed(0) + "px'>" + words[0] +
             (words[1] ? "<i> " + words.slice(1).join(" ") + "</i>" : "") + "</div>";
    } else {
      body = "<div><div class='t-big' style='font-size:" + (scale * 0.16).toFixed(0) + "px'>" + words[0] + "</div>" +
             "<div style='height:1px;background:currentColor;opacity:.3;margin:10px 0'></div>" +
             "<div class='t-ser' style='font-size:" + (scale * 0.1).toFixed(0) + "px;opacity:.75'><i>" +
             (words.slice(1).join(" ") || p.m) + "</i></div></div>";
    }

    var align = (o.lay === "num" || o.lay === "ser") ? "center" : "flex-end";
    return "<div class='pad'>" +
      "<div class='k' style='display:flex;justify-content:space-between'><span>No. " + pad(p.n) + "</span><span>" + p.m + "</span></div>" +
      "<div style='flex:1;display:flex;align-items:" + align + ";min-height:0'>" + body + "</div>" +
      "<div class='k k--b' style='display:flex;justify-content:space-between'><span class='tn'>" + p.y +
      "</span><span style='" + (p.s === "Failed" && o.s !== "red" ? "color:var(--red)" : "") + "'>" + p.s + "</span></div>" +
      "</div>";
  }

  function build(o) {
    var n = document.createElement("article");
    n.className = "o " + (o.s === "none" ? "" :
      o.s === "plate" ? "s-plate" :
      o.s === "plateCool" ? "s-plate s-plate--cool" : "s-" + o.s);
    n.style.cssText = "left:" + o.x + "px;top:" + o.y + "px;width:" + o.w + "px;height:" + o.h + "px";
    if (o.kind === "name") {
      n.style.boxShadow = "none"; n.style.overflow = "visible";
      n.innerHTML = "<div class='t-hero' style='font-size:" + (o.h * 0.92).toFixed(0) +
        "px;color:rgba(243,241,235,.07);white-space:nowrap'>Ashish Narayan</div>";
      return n;
    }

    n.classList.add("o--click");
    var S = Math.min(o.w, o.h);

    if (o.kind === "hero") {
      n.innerHTML = "<div class='pad'><div class='k'>" + o.k + " &mdash; four benches, one rule</div>" +
        "<div class='t-hero' style='font-size:" + (o.h * 0.29).toFixed(0) + "px'>It either<br>" +
        "<span style='color:var(--red)'>closes</span><br>" +
        "<span class='t-ser' style='font-size:.56em;text-transform:none;letter-spacing:-.02em'><i>or it doesn&rsquo;t.</i></span></div>" +
        "<div class='k'>Wood &middot; Code &middot; Classrooms &middot; Companies</div></div>";
    } else if (o.kind === "body") {
      n.innerHTML = "<div class='pad'><div class='k'>" + o.k + "</div>" +
        "<div class='t-body' style='font-size:" + Math.max(12, S * 0.031).toFixed(0) + "px'>" +
        "<b>A record, not a portfolio.</b> A portfolio shows the things that worked. This shows all of it &mdash; " +
        "which is the only version worth anything to someone deciding whether to trust me with their money, " +
        "their timber, or a room full of their students.<br><br>Two of fourteen failed. They are written up at " +
        "the same length as the rest.</div><div class='k'>Smallest real version &rarr; in front of reality &rarr; written down</div></div>";
    } else if (o.kind === "strip") {
      n.innerHTML = "<div class='pad'><div class='k'>The binary</div>" +
        "<div class='t-big' style='font-size:" + (o.h * 0.42).toFixed(0) + "px'>Closes<br>or gaps</div></div>";
    } else if (o.kind === "stat") {
      n.innerHTML = "<div class='pad'><div class='k'>" + o.k + "</div>" +
        "<div><div class='t-num' style='font-size:" + (S * 0.62).toFixed(0) + "px'>" + o.a + "</div>" +
        "<div class='k' style='margin-top:10px'>" + o.b + "</div></div></div>";
    } else if (o.kind === "mat") {
      n.innerHTML = "<div class='pad'><div class='k'>" + (o.k || "Material") + "</div>" +
        "<div class='t-big' style='font-size:" + (S * 0.36).toFixed(0) + "px'>" + o.a + "</div></div>";
    } else if (o.kind === "plate" || o.kind === "plateCool") {
      n.innerHTML = "<span class='plate__rule'></span><div class='pad'><div class='k'>" + o.k + "</div>" +
        "<div class='k' style='opacity:.4'>Surface held &mdash; photograph pending</div></div>";
    } else if (o.kind === "fail") {
      n.innerHTML = "<div class='pad'><div class='k k--b'>Two did not hold</div>" +
        "<div class='t-ser' style='font-size:" + (o.h * 0.17).toFixed(0) + "px'>Right problem.<br><i>Wrong buyer.</i></div>" +
        "<div class='t-body' style='font-size:13px;opacity:.82'><b>Betta Beaut, 2023.</b> The people feeling the pain " +
        "weren&rsquo;t the ones holding the budget. Eighteen months, no second round.</div></div>";
    } else if (o.kind === "index") {
      var rows = WORK.map(function (p) {
        return "<div class='ir" + (p.s === "Failed" ? " ir--f" : "") + "'><span class='tn'>" + pad(p.n) +
          "</span><b>" + p.t + "</b><span class='tn'>" + p.y + " &middot; " + p.s + "</span></div>";
      }).join("");
      n.innerHTML = "<div class='idx'><div class='idx__h'><span class='k' style='color:#6E6A64'>Index &mdash; in order</span>" +
        "<span class='k tn' style='color:#6E6A64'>14 entries</span></div><div class='idx__rows'>" + rows + "</div></div>";
    } else if (o.kind === "mark") {
      n.innerHTML = "<div class='pad' style='align-items:center;justify-content:center'><div style='font-size:" +
        (S * 0.44).toFixed(0) + "px;line-height:1'>" + o.a + "</div></div>";
    } else if (o.kind === "chip") {
      n.innerHTML = "<div class='pad' style='justify-content:center'><div class='k tn'>" + o.a + "</div></div>";
    } else if (o.kind === "contact") {
      n.innerHTML = "<div class='pad'><div class='k k--b'>Tell me what&rsquo;s stuck</div>" +
        "<div class='t-big' style='font-size:" + (o.h * 0.3).toFixed(0) + "px'>ashish<br>.sbs</div></div>";
    } else if (o.kind === "poster") {
      n.innerHTML = posterHTML(o);
      if (wk(o.i).s === "Failed" && o.s === "red") n.classList.add("o--fail");
    }
    return n;
  }

  var nodes = OBJ.map(function (o) { var n = build(o); n.__o = o; world.appendChild(n); return n; });

  /* ══════ pan and zoom ══════ */
  var tx = 0, ty = 0, sc = 1, MIN = 0.12, MAX = 2.2;
  var zoomLbl = document.getElementById("zoom");

  function apply(animate) {
    world.style.transition = animate ? "transform .85s cubic-bezier(.19,.9,.22,1)" : "none";
    world.style.transform = "translate3d(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px,0) scale(" + sc.toFixed(4) + ")";
    zoomLbl.textContent = Math.round(sc * 100) + "%";
  }

  function clamp() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var ww = W * sc, wh = H * sc;
    var padX = vw * 0.5, padY = vh * 0.5;
    tx = Math.min(padX, Math.max(vw - ww - padX, tx));
    ty = Math.min(padY, Math.max(vh - wh - padY, ty));
  }

  function focusRect(x, y, w, h, fit, animate) {
    var vw = window.innerWidth, vh = window.innerHeight;
    var target = Math.min(vw / w, vh / h) * (fit || 0.78);
    sc = Math.min(MAX, Math.max(MIN, target));
    tx = vw / 2 - (x + w / 2) * sc;
    ty = vh / 2 - (y + h / 2) * sc;
    clamp(); apply(animate !== false);
  }

  function overview(animate) { focusRect(0, 0, W, H, 0.92, animate); }

  /* open on the thesis cluster, composed and legible */
  function home(animate) { focusRect(260, 300, 2340, 2040, 0.84, animate); }

  /* drag */
  var down = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = 0;
  stage.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".idx__rows")) return;
    down = true; moved = 0; sx = e.clientX; sy = e.clientY; ox = tx; oy = ty;
    stage.classList.add("drag"); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function (e) {
    if (!down) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    tx = ox + dx; ty = oy + dy; clamp(); apply(false);
  });
  function up(){ down = false; stage.classList.remove("drag"); }
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);

  /* wheel zoom, anchored at the pointer */
  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    var f = Math.pow(0.9988, e.deltaY * (e.deltaMode === 1 ? 16 : 1));
    var next = Math.min(MAX, Math.max(MIN, sc * f));
    f = next / sc;
    tx = e.clientX - (e.clientX - tx) * f;
    ty = e.clientY - (e.clientY - ty) * f;
    sc = next; clamp(); apply(false);
  }, { passive: false });

  /* pinch */
  var pts = {}, pd = 0;
  stage.addEventListener("pointerdown", function (e) { pts[e.pointerId] = e; });
  stage.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in pts)) return;
    pts[e.pointerId] = e;
    var ks = Object.keys(pts);
    if (ks.length !== 2) return;
    down = false;
    var a = pts[ks[0]], b = pts[ks[1]];
    var d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    var mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
    if (pd) {
      var f = d / pd, next = Math.min(MAX, Math.max(MIN, sc * f));
      f = next / sc;
      tx = mx - (mx - tx) * f; ty = my - (my - ty) * f; sc = next; clamp(); apply(false);
    }
    pd = d;
  });
  function clr(e){ delete pts[e.pointerId]; if (Object.keys(pts).length < 2) pd = 0; }
  stage.addEventListener("pointerup", clr);
  stage.addEventListener("pointercancel", clr);

  /* walk up to a plate */
  var veil = document.getElementById("veil"), lifted = null;
  function unfocus() {
    if (lifted) { lifted.classList.remove("lift"); lifted = null; }
    veil.classList.remove("on");
  }
  nodes.forEach(function (n) {
    if (!n.classList.contains("o--click")) return;
    n.addEventListener("click", function (e) {
      if (moved > 6) return;
      e.stopPropagation();
      var o = n.__o;
      unfocus();
      lifted = n; n.classList.add("lift"); veil.classList.add("on");
      focusRect(o.x, o.y, o.w, o.h, 0.72);
    });
  });
  veil.addEventListener("click", unfocus);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { unfocus(); home(); }
    if (e.key === "0") { unfocus(); overview(); }
  });

  /* chrome */
  document.getElementById("bAll").addEventListener("click", function(){ unfocus(); overview(); });
  function zoomBy(f) {
    var vw = window.innerWidth / 2, vh = window.innerHeight / 2;
    var next = Math.min(MAX, Math.max(MIN, sc * f)); f = next / sc;
    tx = vw - (vw - tx) * f; ty = vh - (vh - ty) * f; sc = next; clamp(); apply(true);
  }
  document.getElementById("bIn").addEventListener("click", function(){ zoomBy(1.35); });
  document.getElementById("bOut").addEventListener("click", function(){ zoomBy(1/1.35); });

  var hint = document.getElementById("hint"), hid = false;
  function hideHint(){ if (!hid) { hid = true; hint.classList.add("gone"); } }
  stage.addEventListener("pointerdown", hideHint, { once:true });
  stage.addEventListener("wheel", hideHint, { once:true });
  setTimeout(hideHint, 6500);

  window.addEventListener("resize", function(){ clamp(); apply(false); });

  home(false);
})();
</script>
