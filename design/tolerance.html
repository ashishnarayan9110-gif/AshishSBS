<title>Tolerance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════
   TOLERANCE — design system
   A studio that builds in four materials and publishes the fit of
   every job, including the ones that gapped. The chamfer is the
   signature: every panel has one machined corner. Navy-black
   ground, bone type, signal red reserved for out-of-tolerance.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#0C0E11;
  --pan:#13161B;
  --pan-2:#191D24;
  --pan-3:#222730;
  --bone:#EFEDE7;
  --bone-d:#A8A49C;
  --mute:#767F8B;
  --red:#E8321E;
  --red-d:#8E1709;
  --line:rgba(239,237,231,.12);
  --line-s:rgba(239,237,231,.07);

  --g:"Archivo","Helvetica Neue",Arial,sans-serif;
  --s:"Bodoni Moda",Didot,Georgia,serif;
  --m:"JetBrains Mono",ui-monospace,Menlo,monospace;

  --ch:16px;
  --pl:max(20px,env(safe-area-inset-left,0px));
  --pr:max(20px,env(safe-area-inset-right,0px));
  --max:1240px;
  --ease:cubic-bezier(.22,.9,.26,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--g);font-size:15px;line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--ink)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.034em;line-height:1.02}
p{margin:0}ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
::selection{background:var(--red);color:var(--bone)}

.wrap{max-width:var(--max);margin-inline:auto;padding-left:var(--pl);padding-right:var(--pr)}
.m{font-family:var(--m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.m--b{color:var(--bone)}
.m--r{color:var(--red)}
.tn{font-variant-numeric:tabular-nums}
.ser{font-family:var(--s);font-weight:400;letter-spacing:-.012em}

/* grain */
.grain{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:.17;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='170' height='170' filter='url(%23n)' opacity='.8'/></svg>")}

/* ── chamfer, the signature ── */
.ch{clip-path:polygon(0 0,calc(100% - var(--ch)) 0,100% var(--ch),100% 100%,var(--ch) 100%,0 calc(100% - var(--ch)))}
.ch-tr{clip-path:polygon(0 0,calc(100% - var(--ch)) 0,100% var(--ch),100% 100%,0 100%)}
.ch-bl{clip-path:polygon(0 0,100% 0,100% 100%,var(--ch) 100%,0 calc(100% - var(--ch)))}
.ch-s{--ch:11px}

/* ── header ── */
.hd{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:70;
  background:rgba(12,14,17,.82);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.hd__in{max-width:var(--max);margin-inline:auto;padding-left:var(--pl);padding-right:var(--pr);
  height:58px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:22px;height:22px;flex:none;color:var(--red)}
.logo b{font-weight:700;font-size:14.5px;letter-spacing:.01em}
.logo sup{font-family:var(--m);font-size:9px;opacity:.6;vertical-align:super}
.nav{display:flex;gap:2px}
.nav button{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  padding:8px 12px;position:relative;transition:color .25s}
.nav button:hover{color:var(--bone)}
.nav button[aria-current="true"]{color:var(--bone)}
.nav button[aria-current="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1px;background:var(--red)}
.hd__cta{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--bone);color:var(--ink);padding:9px 15px;transition:background .25s,color .25s;--ch:9px}
.hd__cta:hover{background:var(--red);color:var(--bone)}
@media (max-width:900px){.nav{display:none}}

/* ── shell / transitions ── */
.view{padding-top:58px;min-height:100svh;display:flex;flex-direction:column}
.view__body{flex:1}
.fade{animation:fade .5s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.st>*{animation:fade .55s var(--ease) both}
.st>*:nth-child(1){animation-delay:.03s}.st>*:nth-child(2){animation-delay:.08s}
.st>*:nth-child(3){animation-delay:.13s}.st>*:nth-child(4){animation-delay:.18s}
.st>*:nth-child(5){animation-delay:.23s}.st>*:nth-child(6){animation-delay:.28s}
.st>*:nth-child(n+7){animation-delay:.33s}

/* ── panels ── */
.pn{background:var(--pan);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative}
.pn--2{background:var(--pan-2)}
.pn--line{background:transparent;outline:1px solid var(--line);outline-offset:-1px}
.pn--bone{background:var(--bone);color:var(--ink)}
.pn--bone .m{color:#5C6470}
.pn--red{background:linear-gradient(152deg,#FF5B45 0%,#E8321E 44%,#A01607 100%);color:#FFF2EF}
.pn--red .m{color:rgba(255,242,239,.76)}
.pn--plate{background:radial-gradient(66% 48% at 30% 24%,rgba(255,176,124,.3),transparent 62%),
  linear-gradient(160deg,#2E1A12,#160C09 54%,#080504)}
.pn--plate.cool{background:radial-gradient(66% 48% at 32% 26%,rgba(168,190,222,.2),transparent 62%),
  linear-gradient(160deg,#171C24,#0E1116 54%,#07090B)}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.8'/></svg>")}

/* ── grid ── */
.gr{display:grid;gap:8px;grid-template-columns:repeat(12,1fr)}
.c12{grid-column:span 12}.c9{grid-column:span 12}.c8{grid-column:span 12}
.c6{grid-column:span 12}.c4{grid-column:span 6}.c3{grid-column:span 6}
@media (min-width:880px){
  .c9{grid-column:span 9}.c8{grid-column:span 8}.c6{grid-column:span 6}
  .c4{grid-column:span 4}.c3{grid-column:span 3}
}

/* ── home hero ── */
.hero{padding-block:clamp(30px,5vw,56px) clamp(16px,2.5vw,28px)}
.hero__h{font-size:clamp(38px,7.2vw,96px);line-height:.94;letter-spacing:-.046em;max-width:13ch}
.hero__h em{font-style:normal;font-family:var(--s);font-weight:400;letter-spacing:-.01em}
.hero__sub{font-size:clamp(15px,1.5vw,17px);line-height:1.7;color:var(--bone-d);max-width:44ch}
.hero__n{font-family:var(--m);font-weight:700;font-size:clamp(42px,7.4vw,92px);line-height:.84;letter-spacing:-.045em}
.kv{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.pn--bone .kv{border-color:rgba(12,14,17,.14)}
.pn--red .kv{border-color:rgba(255,242,239,.28)}

/* barcode */
.bc{display:flex;gap:1.6px;align-items:flex-end;height:24px}
.bc i{display:block;width:2px;background:currentColor;opacity:.8}

/* ── unit rows ── */
.units{display:grid;gap:4px}
.unit{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;background:var(--pan);
  padding:14px 16px;text-align:left;width:100%;min-width:0;
  transition:background .26s var(--ease),transform .26s var(--ease)}
.unit:hover{background:var(--pan-3);transform:translateX(5px)}
.unit__t{font-weight:600;font-size:16.5px;letter-spacing:-.018em;margin-top:4px;overflow-wrap:anywhere}
.unit__v{font-family:var(--m);font-weight:700;font-size:17px;letter-spacing:-.02em;margin-top:3px}
.unit--g{outline:1px solid rgba(232,50,30,.5);outline-offset:-1px}
.unit--g .unit__v{color:var(--red)}
.unit__r{text-align:right;white-space:nowrap}

/* ── filters ── */
.fil{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.fil button{font-family:var(--m);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);
  background:var(--pan);padding:9px 13px;transition:background .22s,color .22s;--ch:9px}
.fil button:hover{color:var(--bone)}
.fil button[aria-pressed="true"]{background:var(--bone);color:var(--ink)}

/* ── dossier (case study) ── */
.dos__top{padding-block:clamp(24px,4vw,46px) clamp(14px,2vw,22px)}
.dos__back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px}
.dos__h{font-size:clamp(32px,5.6vw,68px);line-height:.98;letter-spacing:-.042em;max-width:16ch}
.dos__lede{font-size:clamp(16px,1.8vw,20px);line-height:1.62;color:var(--bone-d);max-width:52ch;margin-top:18px}
.dos__meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:4px;margin-top:26px}
.dos__plate{aspect-ratio:21/9;position:relative;overflow:hidden;margin-block:clamp(16px,2.5vw,28px)}
@media (max-width:700px){.dos__plate{aspect-ratio:4/3}}
.dos__plate span.cap{position:absolute;left:16px;bottom:14px;z-index:2}
.prose{display:grid;grid-template-columns:1fr;gap:clamp(22px,3.5vw,44px)}
@media (min-width:900px){.prose{grid-template-columns:200px 1fr}}
.prose h3{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
.prose p{color:var(--bone-d);line-height:1.78;max-width:62ch}
.prose p+p{margin-top:14px}
.prose b{color:var(--bone);font-weight:600}
.block{padding-block:clamp(22px,3.4vw,42px);border-top:1px solid var(--line-s)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px;margin-top:20px}
.fig{background:var(--pan);padding:16px;--ch:11px}
.fig b{display:block;font-family:var(--m);font-weight:700;font-size:25px;letter-spacing:-.025em;margin-top:8px}
.lesson{display:grid;grid-template-columns:28px 1fr;gap:14px;padding-block:14px;border-bottom:1px solid var(--line-s)}
.lesson span{font-family:var(--m);font-size:10px;color:var(--red);padding-top:4px}
.lesson p{color:var(--bone-d);line-height:1.72}

/* ── bench cards ── */
.bench{background:var(--pan);padding:24px;display:flex;flex-direction:column;gap:14px;min-height:230px;
  transition:background .3s var(--ease),transform .3s var(--ease)}
.bench:hover{background:var(--pan-2);transform:translateY(-4px)}
.bench h3{font-size:clamp(24px,3vw,34px);letter-spacing:-.035em}
.bench p{color:var(--bone-d);font-size:14px;line-height:1.66}

/* ── footer ── */
.ft{border-top:1px solid var(--line);margin-top:clamp(40px,6vw,86px);background:var(--pan)}
.ft__g{display:grid;grid-template-columns:1fr;gap:28px;padding-block:clamp(32px,5vw,56px)}
@media (min-width:820px){.ft__g{grid-template-columns:1.6fr 1fr 1fr 1fr}}
.ft h4{font-family:var(--m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:14px;font-weight:400}
.ft li{margin-bottom:9px}
.ft li button,.ft li a{font-size:14px;color:var(--bone-d);transition:color .22s}
.ft li button:hover,.ft li a:hover{color:var(--bone)}
.ft__base{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;
  padding-block:18px 34px;border-top:1px solid var(--line-s)}

.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-block:clamp(26px,4vw,52px) 14px}
.sechead h2{font-size:clamp(22px,2.8vw,32px);letter-spacing:-.03em}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>

<div class="grain" aria-hidden="true"></div>

<header class="hd">
  <div class="hd__in">
    <button class="logo" data-go="home" type="button" aria-label="Tolerance — home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 7h18M3 17h18" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M12 10.2v3.6M10.2 12h3.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      </svg>
      <b>Tolerance<sup>&plusmn;</sup></b>
    </button>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <button class="hd__cta ch-s" data-go="contact" type="button">Start a job</button>
  </div>
</header>

<main id="app"></main>

<script>
(function () {
  "use strict";

  /* ════════════════ CONTENT ════════════════
     Real copy. Every unit has a part code, a measured fit value and
     a status; the five principal ones carry full dossiers. */

  var UNITS = [
    {
      id:"savison-life", code:"SVN-E25A", t:"Savison Life", bench:"Companies", y:2025,
      s:"Running", v:"0,912", role:"Founder, brand, platform", dur:"14 months",
      lede:"A compliance-gated marketplace for third-party pharmaceutical manufacturing in India — four portals running on one schema.",
      brief:"Third-party pharma manufacturing in India runs on WhatsApp, PDFs and reputation. A buyer looking for a WHO-GMP manufacturer for a specific molecule has no way to verify capacity, certification class or audit history without three weeks of phone calls and a site visit. The information exists; none of it is addressable.",
      built:"A marketplace where verification happens at onboarding rather than being claimed in a listing. Four portals — buyer, manufacturer, administrator and logistics — sit on a single Postgres schema, so a certificate uploaded by a manufacturer is the same row the buyer's filter queries and the auditor's export reads. Search runs on molecule, dosage form, certification class and monthly capacity.",
      hard:"Compliance is not a feature you add in month six. Every table needed an audit trail from the first migration, because a marketplace that cannot answer <b>who changed this, and when</b> is not a marketplace a regulated buyer will use. That decision cost roughly three weeks up front and saved the project.",
      figs:[["Portals",'04'],["Schema",'01'],["Molecules indexed",'340+'],["Onboarding checks",'11']],
      lessons:[
        "We built the manufacturer portal first because manufacturers were easier to reach. Wrong order — buyers create the pull, and we spent four months with supply and no demand.",
        "Document verification should have been a paid human step from day one. Automating it first produced false confidence and one bad listing we had to pull.",
        "The admin portal was treated as internal tooling and under-designed. It became the most-used surface in the business."
      ],
      plate:"warm"
    },
    {
      id:"betta-beaut", code:"BTB-X23E", t:"Betta Beaut", bench:"Companies", y:2023,
      s:"Gapped", v:"0,185", role:"Founder", dur:"18 months",
      lede:"Salon operations software. The right problem, sold to the wrong person — and the clearest failure on this record.",
      brief:"Independent salons run on paper appointment books, a cash drawer and a stylist's memory. Double bookings, no-shows and stock running out mid-service are daily, and every one of them costs a chair-hour. The pain is real, constant, and easy to measure.",
      built:"Appointment scheduling, client history, stock tracking and a simple commission ledger. Built mobile-first because a stylist's hands are busy and the phone is already in the apron. Fourteen salons used it. The product worked.",
      hard:"The people feeling the pain were not the people holding the budget. Stylists loved it and had no authority to buy. Owners controlled spend, visited the floor twice a week, and experienced none of the problems the software solved. Every demo went well with the wrong person in the room. <b>Eighteen months, no second round.</b>",
      figs:[["Salons live",'14'],["Months",'18'],["Churn at 6mo",'64%'],["Fit value",'0,185']],
      lessons:[
        "Find the budget holder before writing a line of code. If the user and the buyer are different people, you are selling two products and have built one.",
        "High usage is not product-market fit. Our daily active rate was excellent right up until the renewal invoices went out.",
        "I kept rebuilding features in response to stylist feedback. Every one of those sprints was a comfortable way to avoid the sales problem."
      ],
      plate:"warm"
    },
    {
      id:"mortise-bench", code:"MRT-S20J", t:"Mortise Bench", bench:"Wood", y:2020,
      s:"Shipped", v:"0,961", role:"Design and build", dur:"7 weeks",
      lede:"A hand-cut mortise and tenon workbench. The tool that made every other piece of furniture possible.",
      brief:"Nothing accurate can be built without a flat, heavy, immovable reference surface. Everything made before this bench was made on a folding table, and every one of those pieces is out of square in a way you can feel when you open a drawer.",
      built:"Beech top at 90mm, laminated from eight boards and flattened by hand over three sessions. Legs joined to rails with drawbored mortise and tenon — no bolts, no hardware, the joint tightens as the wood moves. A face vice and a tail vice. Dog holes on a 96mm grid.",
      hard:"Drawboring means offsetting the peg hole in the tenon by about 1mm so that driving the peg pulls the joint closed permanently. Get it wrong by half a millimetre in the wrong direction and you split the cheek of the mortise. <b>I split two before the third went right.</b>",
      figs:[["Top thickness",'90mm'],["Weight",'118kg'],["Build time",'7wk'],["Joints split",'02']],
      lessons:[
        "Build the reference surface first. Everything made before it has to be remade.",
        "Hand-flattening a 90mm top is two days of work and the single highest-value thing I have ever done with a plane.",
        "Mass is a feature. The bench does not move, so the work does not move, so the cut is where you put it."
      ],
      plate:"cool"
    },
    {
      id:"indizilla", code:"IDZ-E24C", t:"Indizilla", bench:"Code", y:2024,
      s:"Running", v:"0,788", role:"Architecture and build", dur:"9 months",
      lede:"The operations platform behind a marketing agency — orders, jobs, billing, credits and referrals on a single database.",
      brief:"The agency ran on six tools that did not speak to each other. An order lived in a spreadsheet, the job in a project board, the invoice in accounting software, and the client's credit balance in somebody's head. Reconciling a month took two days.",
      built:"One Postgres database with orders, jobs, invoices, credits and referrals as first-class tables, and one interface over all of it. A credit issued against a late delivery is the same row the invoice subtracts from and the client dashboard displays. Month-end reconciliation went from two days to an afternoon.",
      hard:"Credits are deceptively difficult. A credit can be partial, can expire, can apply to one line item or a whole invoice, and can be issued after the invoice is paid. Modelling it as a simple balance field was wrong three separate times before it became a ledger of immutable entries.",
      figs:[["Tools replaced",'06'],["Reconcile time",'-78%'],["Tables",'31'],["Months",'09']],
      lessons:[
        "Anything resembling money should be an append-only ledger, not a mutable balance. I learned this by corrupting a balance twice.",
        "The spreadsheet the team already used was a better spec than anything they could describe in a meeting.",
        "Shipping the orders module alone, before the rest existed, bought nine months of goodwill."
      ],
      plate:"cool"
    },
    {
      id:"folding-wall-table", code:"FWT-X22K", t:"Folding Wall Table", bench:"Wood", y:2022,
      s:"Gapped", v:"0,185", role:"Design and build", dur:"5 months",
      lede:"A wall-mounted drop-leaf for a small flat. It sagged within a month, was rebuilt twice, then abandoned.",
      brief:"A 1.4m dining surface for a flat with no room for a dining table — up for meals, flat against the wall the rest of the time. The constraint was that it had to hold a loaded table without a leg reaching the floor.",
      built:"A beech leaf on a piano hinge with a folding steel bracket. Version one used a bracket rated for the static load. Version two doubled the bracket count. Version three moved to a cantilevered timber arm housed into a wall cleat.",
      hard:"The static load rating was never the problem. The failure mode is <b>dynamic</b> — someone leans on the edge while standing up, and for a quarter of a second the bracket sees three times its rated load. All three versions eventually sagged at the hinge line. The right answer was a leg, and I did not want it to need a leg.",
      figs:[["Versions",'03'],["Span",'1.4m'],["Time to sag",'~4wk'],["Fit value",'0,185']],
      lessons:[
        "Design for the dynamic load, not the static one. Furniture is used by people who lean.",
        "I had decided the piece should not need a leg before I had established that it could work without one. That is a preference, not a specification.",
        "Rebuilding twice without re-examining the premise is a way of looking busy while avoiding the actual answer."
      ],
      plate:"warm"
    },
    { id:"rikencare", code:"RKC-S25B", t:"Rikencare Lifesciences", bench:"Code", y:2025, s:"Shipped", v:"0,840", role:"Brand and build", dur:"4 months",
      lede:"Identity and site for a WHO-GMP, ISO 9001:2015 third-party manufacturer in Himachal Pradesh." },
    { id:"getpharm", code:"GTP-E25D", t:"GetPharm", bench:"Companies", y:2025, s:"Running", v:"0,755", role:"Brand, product", dur:"6 months",
      lede:"A public-facing marketplace brand built on Savison Life's infrastructure — same spine, different front door." },
    { id:"nirmal-kaya", code:"NRK-P24F", t:"Nirmal Kaya", bench:"Companies", y:2024, s:"Paused", v:"0,480", role:"Founder", dur:"8 months",
      lede:"A wellness management venture, parked while the pharmaceutical side took the oxygen. The record stays up." },
    { id:"performance-realty", code:"PRF-E26G", t:"Performance Realty", bench:"Companies", y:2026, s:"Running", v:"0,702", role:"Brand, site", dur:"3 months",
      lede:"Advisory brand with one live listing — an HSIIDC industrial plot in Barwala. Inquiries reach a person, not a funnel." },

      btn.setAttribute("aria-pressed", b === filter ? "true" : "false");
      btn.addEventListener("click", function () { filter = b; mountWork(); });
      fil.appendChild(btn);
    });
    var sortBtn = h("button", "ch-s", sortKey === "n" ? "Sort: index" : "Sort: fit");
    sortBtn.type = "button";
    sortBtn.style.marginLeft = "auto";
    sortBtn.addEventListener("click", function () { sortKey = sortKey === "n" ? "v" : "n"; mountWork(); });
    fil.appendChild(sortBtn);

    var list = UNITS.filter(function (u) { return filter === "All" || u.bench === filter; });
    if (sortKey === "v") list = list.slice().sort(function (a, b) { return parseFloat(b.v.replace(",", ".")) - parseFloat(a.v.replace(",", ".")); });

    var box = document.getElementById("units");
    box.innerHTML = "";
    list.forEach(function (u, i) {
      var b = h("button", "unit ch-s" + (u.s === "Gapped" ? " unit--g" : ""));
      b.type = "button"; b.setAttribute("data-unit", u.id);
      b.style.animation = "fade .4s var(--ease) both"; b.style.animationDelay = (i * 0.022) + "s";
      b.innerHTML =
        "<span style='min-width:0'><span class='m tn'>" + u.code + " &middot; " + u.bench + "</span>" +
        "<span class='unit__t'>" + u.t + "</span></span>" +
        "<span class='unit__r'><span class='m tn'>" + u.y + " &middot; " + u.s + "</span>" +
        "<span class='unit__v tn'>" + u.v + "</span></span>";
      box.appendChild(b);
    });
  }

  document.addEventListener("click", function (e) {
    var g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); render(g.getAttribute("data-go")); return; }
    var u = e.target.closest("[data-unit]");
    if (u) { e.preventDefault(); render("unit", u.getAttribute("data-unit")); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && current === "unit") render("work");
  });

  render("home");
})();
</script>
