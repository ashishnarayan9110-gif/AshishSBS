<title>Tolerance Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════
   EDITION B — THE SHELF
   No colour anywhere, by rule. Every image is ASCII dithered: a
   tonal field sampled into a character grid, each cell chosen by
   ink coverage. The imagery is literally made of type.

   The landing has no grid — the operator hangs in space and the
   record drifts around him. Grids return the moment you enter the
   volume.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#08080A;
  --paper:#FBFAF8;
  --g:"Archivo","Helvetica Neue",Arial,sans-serif;
  --s:"Bodoni Moda",Didot,Georgia,serif;
  --m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --pl:max(18px,env(safe-area-inset-left,0px));
  --pr:max(18px,env(safe-area-inset-right,0px));
  --max:1360px;
  --e:cubic-bezier(.2,.9,.24,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--g);font-size:15px;line-height:1.55;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"kern","liga"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:95;background:var(--ink)}
h1,h2,h3{margin:0;line-height:.98;letter-spacing:-.028em}
p{margin:0}ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
::selection{background:var(--paper);color:var(--ink)}
.wrap{max-width:var(--max);margin-inline:auto;padding-left:var(--pl);padding-right:var(--pr)}
.m{font-family:var(--m);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.m--b{opacity:1}
.tn{font-variant-numeric:tabular-nums}

/* ── the glass: scanlines + phosphor bloom, no colour ── */
.crt{position:fixed;inset:0;z-index:92;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.26) 2px 3px);opacity:.5}
.vig{position:fixed;inset:0;z-index:91;pointer-events:none;
  background:radial-gradient(128% 96% at 50% 46%,transparent 40%,rgba(0,0,0,.84) 100%)}
.prog{position:fixed;left:0;top:0;height:2px;background:var(--paper);z-index:94;width:0}

/* ── ASCII rendering ── */
.ax{font-family:var(--m);font-weight:400;white-space:pre;display:block;margin:0;
  letter-spacing:0;line-height:1.0;user-select:none;-webkit-user-select:none}
.ax--glow{text-shadow:0 0 6px rgba(251,250,248,.5),0 0 22px rgba(251,250,248,.18)}

/* ═════ LANDING — free space, no grid ═════ */
.space{position:relative;min-height:100svh;overflow:hidden;display:grid;place-items:center}
.space__fig{position:relative;z-index:3;display:grid;place-items:center;will-change:transform}
.space__fig .ax{font-size:clamp(4.4px,1.08vw,11px);opacity:.96}
.space__sig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;
  width:min(72vw,620px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(251,250,248,.1),transparent 66%);filter:blur(30px)}

/* things hovering in the space */
.drift{position:absolute;z-index:4;will-change:transform}
.drift__in{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 13px;border:1px solid rgba(251,250,248,.26);background:rgba(8,8,10,.52);
  backdrop-filter:blur(7px);white-space:nowrap;transition:border-color .4s,background .4s}
.drift__in b{display:block;font-family:var(--s);font-size:22px;letter-spacing:-.01em;margin-top:4px;text-transform:none}
.drift:hover .drift__in{border-color:var(--paper);background:rgba(251,250,248,.1)}
.drift--q .drift__in{border-style:dashed;opacity:.72}
.drift--strike b{text-decoration:line-through;text-decoration-thickness:.05em}
@media (max-width:760px){ .drift--hide{display:none} }

.wires{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.3}
.wires line{stroke:rgba(251,250,248,.5);stroke-width:.7;stroke-dasharray:2 5}

.space__name{position:absolute;left:50%;bottom:clamp(74px,13vh,132px);transform:translateX(-50%);z-index:5;
  text-align:center;pointer-events:none;width:min(92vw,680px)}
.space__name h1{font-family:var(--s);font-weight:400;font-size:clamp(34px,7.6vw,96px);line-height:.92;letter-spacing:-.022em}
.space__name h1 sup{font-family:var(--m);font-size:.16em;vertical-align:super;opacity:.55;letter-spacing:.08em}
.space__name p{font-family:var(--m);font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.6;margin-top:16px}
.cursorblk{display:inline-block;width:.5em;height:1em;background:var(--paper);vertical-align:-.12em;
  margin-left:.18em;animation:blk 1.08s steps(2,end) infinite}
@keyframes blk{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.enter{position:absolute;left:50%;bottom:clamp(26px,5vh,54px);transform:translateX(-50%);z-index:6;
  font-family:var(--m);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  padding:12px 22px;border:1px solid rgba(251,250,248,.36);transition:background .3s,color .3s,border-color .3s}
.enter:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ═════ CHROME (hidden on landing) ═════ */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:var(--ink);
  border-bottom:1px solid rgba(251,250,248,.22)}
.hd__in{max-width:var(--max);margin-inline:auto;padding-left:var(--pl);padding-right:var(--pr);
  height:46px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd__n{display:flex;gap:18px}
.hd__n button{font-family:var(--m);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;transition:opacity .3s}
.hd__n button:hover,.hd__n button[aria-current="true"]{opacity:1}
.hd__n button[aria-current="true"]{text-decoration:underline;text-underline-offset:4px}
@media (max-width:760px){.hd__n button:not(:last-child){display:none}}
.hd[hidden]{display:none}

/* ── reveal ── */
.up{opacity:0;transform:translateY(20px);transition:opacity .8s var(--e),transform .8s var(--e)}
.rv .up,.up.rv{opacity:1;transform:none}
.rv .up:nth-child(2){transition-delay:.05s}.rv .up:nth-child(3){transition-delay:.1s}

/* ═════ GRID RETURNS ═════ */
.mast{padding-block:clamp(30px,6vh,74px) clamp(20px,3vh,40px);border-bottom:1px solid rgba(251,250,248,.22)}
.mast__t{font-family:var(--s);font-weight:400;font-size:clamp(50px,16vw,220px);line-height:.8;letter-spacing:-.022em}
.mast__t sup{font-size:.16em;vertical-align:super;font-family:var(--m);letter-spacing:.08em;opacity:.5}
.mast__r{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;align-items:flex-end;margin-top:clamp(14px,2.4vh,28px)}
.mast__r p{max-width:48ch;font-size:14.5px;line-height:1.85;opacity:.76}
.mast__fig{display:flex;gap:clamp(16px,3vw,42px)}
.mast__fig b{display:block;font-family:var(--s);font-weight:400;font-size:clamp(24px,3.2vw,42px);line-height:1}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(226px,100%),1fr));
  border-left:1px solid rgba(251,250,248,.22)}
.cov{position:relative;aspect-ratio:3/4;overflow:hidden;padding:16px;isolation:isolate;width:100%;
  border-right:1px solid rgba(251,250,248,.22);border-bottom:1px solid rgba(251,250,248,.22);
  display:flex;flex-direction:column;justify-content:space-between}
.cov__w{position:absolute;inset:0;z-index:0;background:var(--paper);transform:translateY(101%);transition:transform .62s var(--e)}
.cov:hover .cov__w{transform:translateY(0)}
.cov--p .cov__w{background:var(--ink);transform:translateY(0)}
.cov--p:hover .cov__w{transform:translateY(101%)}
.cov__c{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;height:100%;transition:color .4s var(--e)}
.cov:hover .cov__c{color:var(--ink)}
.cov--p .cov__c{color:var(--ink)}
.cov--p:hover .cov__c{color:var(--paper)}
.cov__h,.cov__f{display:flex;justify-content:space-between;gap:8px}
.cov__b{position:absolute;inset:16px;display:flex;z-index:1;pointer-events:none;transition:color .4s var(--e)}
.cov:hover .cov__b{color:var(--ink)}
.cov--p .cov__b{color:var(--ink)}
.cov--p:hover .cov__b{color:var(--paper)}

.l-rep{flex-direction:column;justify-content:center;gap:.012em}
.l-rep b{font-weight:900;font-size:clamp(16px,1.9vw,25px);letter-spacing:-.05em;line-height:.9;text-transform:uppercase;white-space:nowrap;display:block}
.l-rep b:nth-child(even){opacity:.28}
.l-ser{align-items:center;justify-content:center;text-align:center}
.l-ser b{font-family:var(--s);font-weight:400;font-size:clamp(26px,3.3vw,42px);line-height:.98;display:block}
.l-ser i{font-style:italic;display:block;opacity:.7}
.l-rot{align-items:center;justify-content:flex-start}
.l-rot b{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;font-size:clamp(22px,2.8vw,37px);letter-spacing:-.045em;text-transform:uppercase}
.l-num{align-items:center;justify-content:center}
.l-num b{font-family:var(--s);font-weight:400;font-size:clamp(84px,12vw,150px);line-height:.72}
.l-crop{align-items:flex-end;overflow:hidden}
.l-crop b{font-weight:900;font-size:clamp(50px,7.4vw,104px);letter-spacing:-.062em;line-height:.78;text-transform:uppercase;white-space:nowrap;margin-left:-.06em}
.l-stack{align-items:flex-end}
.l-stack b{font-weight:900;font-size:clamp(21px,2.5vw,35px);letter-spacing:-.05em;line-height:.84;text-transform:uppercase;display:block}
.l-ring{align-items:center;justify-content:center}
.l-ring b{font-family:var(--s);font-size:clamp(17px,2vw,25px);border:1px solid currentColor;border-radius:50%;
  width:84%;aspect-ratio:1;display:grid;place-items:center;padding:12px;line-height:1.08;text-align:center}
.l-ascii{align-items:center;justify-content:center;overflow:hidden}
.l-ascii .ax{font-size:clamp(2.6px,.62vw,5.4px);opacity:.9}
.strike b{text-decoration:line-through;text-decoration-thickness:.055em}

/* ── spread ── */
.sp{padding-block:clamp(22px,3.4vh,44px) 0}
.sp__head{display:flex;justify-content:space-between;gap:14px;padding-bottom:12px;
  border-bottom:1px solid rgba(251,250,248,.22);margin-bottom:clamp(22px,3.6vh,46px)}
.sp__t{font-family:var(--s);font-weight:400;font-size:clamp(36px,7.4vw,112px);line-height:.92;letter-spacing:-.022em;max-width:13ch}
.sp__l{font-size:clamp(16px,1.8vw,21px);line-height:1.6;opacity:.76;max-width:50ch;margin-top:20px;font-family:var(--s)}
.sp__plate{margin-block:clamp(20px,3.4vh,46px);border:1px solid rgba(251,250,248,.2);padding:14px;overflow:hidden;
  display:grid;place-items:center}
.sp__plate .ax{font-size:clamp(3.2px,.78vw,7px);opacity:.92}
.sp__cap{display:flex;justify-content:space-between;gap:12px;margin-top:12px}
.sp__grid{display:grid;grid-template-columns:1fr;gap:clamp(22px,3.4vw,54px);margin-top:clamp(24px,4vh,54px)}
@media (min-width:920px){.sp__grid{grid-template-columns:1fr 190px}}
.body{max-width:66ch}
.body h3{font-family:var(--m);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;
  margin:clamp(24px,3.6vh,42px) 0 12px;font-weight:400}
.body h3:first-child{margin-top:0}
.body p{font-size:16.5px;line-height:1.78;opacity:.88;font-feature-settings:"kern","liga","onum"}
.body p+p{margin-top:14px}
.body b{opacity:1;font-weight:700}
.body .drop::first-letter{font-family:var(--s);font-size:4.1em;float:left;line-height:.82;padding:.06em .1em 0 0;font-weight:400}
.marg{font-size:12.5px;line-height:1.75;opacity:.55;font-family:var(--m)}
.marg div+div{margin-top:18px;padding-top:18px;border-top:1px solid rgba(251,250,248,.16)}
.marg b{display:block;opacity:1;font-family:var(--s);font-size:23px;font-weight:400;margin-top:5px;letter-spacing:-.01em}
.ls{display:grid;grid-template-columns:24px 1fr;gap:14px;padding-block:14px;border-bottom:1px solid rgba(251,250,248,.14)}
.ls span{font-family:var(--m);font-size:9.5px;opacity:.5;padding-top:6px}
.ls p{font-size:15.5px;line-height:1.75;opacity:.82}
.folio{display:flex;justify-content:space-between;gap:14px;padding-block:22px 40px;margin-top:clamp(24px,4vh,50px);
  border-top:1px solid rgba(251,250,248,.22)}

.idx{padding-block:clamp(30px,5.4vh,72px)}
.row{display:grid;grid-template-columns:3ch 1fr auto;gap:16px;align-items:baseline;padding-block:14px;width:100%;
  border-bottom:1px solid rgba(251,250,248,.14);transition:padding-left .4s var(--e),background .3s,color .3s}
.row:hover{padding-left:11px;background:var(--paper);color:var(--ink)}
.row b{font-family:var(--s);font-weight:400;font-size:clamp(18px,2.2vw,26px);letter-spacing:-.008em}
.row--g b{text-decoration:line-through;text-decoration-thickness:.05em}

.colo{border-top:1px solid rgba(251,250,248,.22);margin-top:clamp(28px,4.6vh,60px)}
.colo__g{display:grid;grid-template-columns:1fr;gap:24px;padding-block:clamp(24px,3.6vh,44px)}
@media (min-width:820px){.colo__g{grid-template-columns:1.6fr 1fr 1fr}}
.colo h4{font-family:var(--m);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;font-weight:400;margin-bottom:12px}
.colo li{margin-bottom:8px}.colo li button{font-size:14px;opacity:.72;transition:opacity .25s}
.colo li button:hover{opacity:1}
.colo__b{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;padding-block:16px 36px;
  border-top:1px solid rgba(251,250,248,.14)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .up{opacity:1;transform:none}
}
</style>

<div class="vig" aria-hidden="true"></div>
<div class="crt" aria-hidden="true"></div>
<div class="prog" id="prog" aria-hidden="true"></div>

<header class="hd" id="hd" hidden><div class="hd__in">
  <button class="m m--b" data-go="home" type="button">Tolerance&nbsp;&plusmn;</button>
  <nav class="hd__n" id="nav" aria-label="Primary"></nav>
  <span class="m tn" id="folio">Vol. I</span>
</div></header>

<main id="app"></main>

<script>
(function () {
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ═══════════════════════════════════════════════════════════
     ASCII DITHERING
     A tonal field is painted to an offscreen canvas, then sampled
     one cell per character. The glyph is chosen by ink coverage,
     which is dithering with a character palette instead of a pixel
     one. Monospace cells are about half as wide as they are tall,
     so the vertical sample rate is halved to keep proportion.
     ═══════════════════════════════════════════════════════════ */
  var RAMP = " .,:;i1tfLCG08@";          // light → heavy ink coverage
  var CELL_ASPECT = 0.5;                  // glyph width ÷ glyph height

  function sample(paintFn, cols, srcW, srcH, gamma) {
    var rows = Math.max(6, Math.round(cols * (srcH / srcW) * CELL_ASPECT));
    var cv = document.createElement("canvas");
    cv.width = srcW; cv.height = srcH;
    var c = cv.getContext("2d");
    paintFn(c, srcW, srcH);
    var d = c.getImageData(0, 0, srcW, srcH).data;
    var cw = srcW / cols, chh = srcH / rows, out = "";
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        // average the block so the glyph reflects real coverage
        var x0 = Math.floor(x * cw), x1 = Math.min(srcW, Math.ceil((x + 1) * cw));
        var y0 = Math.floor(y * chh), y1 = Math.min(srcH, Math.ceil((y + 1) * chh));
        var sum = 0, n = 0;
        for (var yy = y0; yy < y1; yy += 2) {
          for (var xx = x0; xx < x1; xx += 2) {
            var k = (yy * srcW + xx) * 4;
            sum += (d[k] * 0.299 + d[k + 1] * 0.587 + d[k + 2] * 0.114);
            n++;
          }
        }
        var t = n ? sum / n / 255 : 0;
        // lift the midtones so the whole ramp gets exercised; without
        // this a lit subject sits in the bottom third and reads faint
        if (gamma) t = Math.pow(t, gamma);
        var i = Math.max(0, Math.min(RAMP.length - 1, Math.round(t * (RAMP.length - 1))));
        out += RAMP.charAt(i);
      }
      out += "\n";
    }
    return out;
  }

  function rng(s){ var x = s * 9301 + 49297; return function(){ x = (x*9301+49297)%233280; return x/233280; }; }

  /* ── the operator: a lit bust, painted as tone not outline. At
     character resolution the medium does the abstraction, which is
     why an ASCII portrait reads where a hard silhouette does not. ── */
  function paintOperator(c, W, H) {
    c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
    var cx = W * 0.5, u = H * 0.3, ty = H * 0.1;   // u = head height

    function soft(x, y, rx, ry, a, rot) {
      var g = c.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
      g.addColorStop(0, "rgba(255,255,255," + a + ")");
      g.addColorStop(1, "rgba(255,255,255,0)");
      c.save(); c.translate(x, y); if (rot) c.rotate(rot);
      c.scale(1, ry / Math.max(rx, ry)); c.translate(-x, -y);
      c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
    }

    // shoulders and chest
    soft(cx, ty + u * 2.3, u * 1.95, u * 1.0, .5);
    soft(cx, ty + u * 2.65, u * 2.3, u * 0.9, .34);
    // neck
    soft(cx + u * .02, ty + u * 1.12, u * .3, u * .36, .44);
    // skull mass
    soft(cx, ty + u * .52, u * .56, u * .68, .72);
    // forehead and cheek planes, lit from the left
    soft(cx - u * .2, ty + u * .36, u * .34, u * .34, .55);
    soft(cx - u * .26, ty + u * .66, u * .22, u * .26, .42);
    // jaw
    soft(cx, ty + u * .92, u * .34, u * .22, .4);
    // hair falls dark over the crown and the right side
    c.globalCompositeOperation = "destination-out";
    soft(cx + u * .06, ty + u * .18, u * .58, u * .4, .9);
    soft(cx + u * .4, ty + u * .55, u * .24, u * .5, .66);
    // eye sockets, nose shadow, mouth line
    soft(cx - u * .22, ty + u * .55, u * .1, u * .055, .8);
    soft(cx + u * .17, ty + u * .55, u * .1, u * .055, .72);
    soft(cx + u * .02, ty + u * .74, u * .07, u * .09, .5);
    soft(cx, ty + u * .88, u * .14, u * .03, .55);
    c.globalCompositeOperation = "source-over";
    // rim light down the left profile
    var rl = c.createLinearGradient(cx - u * .62, 0, cx - u * .1, 0);
    rl.addColorStop(0, "rgba(255,255,255,.0)");
    rl.addColorStop(.55, "rgba(255,255,255,.5)");
    rl.addColorStop(1, "rgba(255,255,255,0)");
    c.globalCompositeOperation = "lighter";
    c.fillStyle = rl; c.fillRect(cx - u * .62, ty + u * .1, u * .55, u * 1.1);
    c.globalCompositeOperation = "source-over";
    // settle the frame
    var v = c.createRadialGradient(cx, H * .45, 0, cx, H * .45, Math.max(W, H) * .62);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.92)");
    c.fillStyle = v; c.fillRect(0, 0, W, H);
  }

  /* ── placeholder plate: a tonal field standing in for a photograph,
     normalised so the whole frame sits inside the ramp ── */
  function makePlate(seed) {
    return function (c, W, H) {
      var r = rng(seed);
      c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
      var lobes = [];
      for (var i = 0; i < 4; i++) lobes.push([r()*W, r()*H, (.26+r()*.4)*Math.max(W,H), .4+r()*.5]);
      var img = c.createImageData(W, H), d = img.data;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var t = .08 + (1 - y / H) * .18;                 // gentle ramp
          for (var l = 0; l < lobes.length; l++) {
            var L = lobes[l], dx = x - L[0], dy = (y - L[1]) * 1.2;
            var dist = Math.sqrt(dx*dx + dy*dy) / L[2];
            t += Math.max(0, 1 - dist * dist) * L[3];      // smooth falloff
          }

    space.addEventListener("pointermove", function(e){

      tpx = (e.clientX - r.left) / r.width - .5;
      tpy = (e.clientY - r.top) / r.height - .5;
    });
    var t0 = performance.now();
    (function tick(now){
      var t = (now - t0) / 1000;
      px += (tpx - px) * .05; py += (tpy - py) * .05;
      nodes.forEach(function(n, i){

        var ox = Math.sin(t / sp * 2 + ph) * 16 + Math.cos(t / (sp*1.7) + ph) * 8;
        var oy = Math.cos(t / sp * 2.2 + ph) * 13 + Math.sin(t / (sp*1.4) + ph) * 6;
        var depth = .45 + (i % 4) * .22;
        n.style.transform = "translate3d(" + (ox - px * 44 * depth).toFixed(2) + "px," +
          (oy - py * 32 * depth).toFixed(2) + "px,0)";
      });
      if (fig) fig.style.transform = "translate3d(" + (px * 16).toFixed(2) + "px," +
        (py * 12 + Math.sin(t/7) * 5).toFixed(2) + "px,0)";

    route = r;
    var isHome = (r === "home");
    hd.hidden = isHome;
    app.innerHTML = isHome ? V.home()
      : "<div>" + (r==="unit" ? V.unit(arg) : (V[r]||V.shelf)()) + colophonFoot() + "</div>";
    [].slice.call(navEl.children).forEach(function(b){
      b.setAttribute("aria-current", b.getAttribute("data-go")===(r==="unit"?"shelf":r) ? "true":"false"); });
    folio.textContent = r==="unit" ? (ROMAN[U.indexOf(U_(arg))] + " / XIV") : "Vol. I";
    if (r==="shelf") mountShelf();
    if (r==="index") mountRows();
    if (isHome) { startDrift(); typeTagline(); }
    scrollTo(0,0); mark();
  }

  function mark(){
    [].slice.call(document.querySelectorAll("[data-rv],.up")).forEach(function(n){
      var r = n.getBoundingClientRect();
      if (r.top < innerHeight*0.9 && r.bottom > -100) n.classList.add("rv");
    });
  }
  addEventListener("scroll", function(){
    mark();
    var max = document.body.scrollHeight - innerHeight;
    document.getElementById("prog").style.width = (max>0 ? scrollY/max*100 : 0).toFixed(2)+"%";
  }, { passive:true });

  document.addEventListener("click", function(e){
    var g = e.target.closest("[data-go]"); if (g){ render(g.getAttribute("data-go")); return; }
    var u = e.target.closest("[data-unit]"); if (u){ render("unit", u.getAttribute("data-unit")); }
  });

  var rt; addEventListener("resize", function(){
    clearTimeout(rt); rt = setTimeout(function(){ render(route); }, 280);
  });

  render("home");
})();
</script>
