<style>
/* ═══════════════════════════════════════════════════════════════
   EDITION A — THE GALLERY
   A dark hanging wall. Every work is a poster with its own painted
   field — no two gradients alike, each generated from the unit's
   own seed. Light follows the cursor across each surface. Clicking
   a poster opens the full dossier.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --void:#0A0A0C;
  --wall:#0E0E11;
  --pan:#15151A;
  --pan2:#1C1C23;
  --bone:#F3F0E9;
  --dim:#9B968E;
  --mute:#6E6A64;
  --red:#EC3418;
  --ember:#FF7A45;
  --line:rgba(243,240,233,.1);
  --g:"Archivo","Helvetica Neue",Arial,sans-serif;
  --s:"Bodoni Moda",Didot,Georgia,serif;
  --m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
  --pl:max(18px,env(safe-area-inset-left,0px));
  --pr:max(18px,env(safe-area-inset-right,0px));
  --max:1340px;
  --e:cubic-bezier(.2,.9,.24,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--bone);font-family:var(--g);font-size:15px;line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:95;background:var(--void)}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.016em;line-height:1.04;font-family:var(--s)}
.sans{font-family:var(--g);font-weight:700;letter-spacing:-.04em}
p{margin:0}ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
::selection{background:var(--red);color:var(--bone)}
.wrap{max-width:var(--max);margin-inline:auto;padding-left:var(--pl);padding-right:var(--pr)}
.m{font-family:var(--m);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--mute)}
.m--b{color:var(--bone)}
.tn{font-variant-numeric:tabular-nums}

.grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.17;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='170' height='170' filter='url(%23n)' opacity='.85'/></svg>")}
.prog{position:fixed;left:0;top:0;height:2px;background:var(--red);z-index:92;width:0}

/* ── chrome, like a proofing window ── */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:rgba(10,10,12,.78);
  backdrop-filter:blur(20px) saturate(1.3);border-bottom:1px solid var(--line)}
.hd__in{max-width:var(--max);margin-inline:auto;padding-left:var(--pl);padding-right:var(--pr);
  height:54px;display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(243,240,233,.2)}
.dots i:first-child{background:rgba(236,52,24,.7)}
.hd__rule{flex:1;height:1px;background:var(--line)}
.hd__box{border:1px solid rgba(243,240,233,.22);padding:3px 9px}
.hd__nav{display:flex;gap:4px}
.hd__nav button{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  padding:7px 11px;border-radius:999px;transition:color .25s,background .25s}
.hd__nav button:hover{color:var(--bone)}
.hd__nav button[aria-current="true"]{color:var(--bone);background:rgba(243,240,233,.08)}
@media (max-width:860px){.hd__nav,.hd__box{display:none}}

/* ── reveal ── */
.up{opacity:0;transform:translateY(22px);transition:opacity .85s var(--e),transform .85s var(--e)}
.rv .up,.up.rv{opacity:1;transform:none}
.rv .up:nth-child(2){transition-delay:.05s}.rv .up:nth-child(3){transition-delay:.1s}
.rv .up:nth-child(4){transition-delay:.15s}.rv .up:nth-child(5){transition-delay:.2s}

/* ── poster: a painted field with light that follows the cursor ── */
.po{position:relative;overflow:hidden;border-radius:var(--r);background:var(--pan);isolation:isolate;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 2px 0 rgba(255,255,255,.05) inset, 0 30px 60px -28px rgba(0,0,0,.9);
  transition:transform .55s var(--e),box-shadow .55s var(--e)}
.po:hover{transform:translateY(-7px);box-shadow:0 2px 0 rgba(255,255,255,.1) inset,0 56px 90px -34px rgba(0,0,0,1)}
.po__cv{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block}
.po__lt{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,210,180,.3),transparent 70%);
  mix-blend-mode:screen}
.po:hover .po__lt{opacity:1}
.po__n{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.8'/></svg>")}
.po__in{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:space-between;
  height:100%;gap:16px;padding:clamp(17px,2vw,26px)}
.po__k{display:flex;justify-content:space-between;gap:10px}
.po__t{font-size:clamp(23px,2.6vw,36px);line-height:1.02}
.po__t--xl{font-size:clamp(32px,4.4vw,64px)}
.po__dev{font-size:clamp(17px,1.9vw,24px);opacity:.6;margin-top:6px}
.po__d{font-size:13.5px;line-height:1.62;color:rgba(243,240,233,.72);max-width:42ch;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid currentColor;border-radius:999px;
  padding:5px 11px;font-family:var(--m);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.pill--r{color:#FFC9BC;border-color:rgba(255,120,90,.7);background:rgba(236,52,24,.18)}

/* ── hero ── */
.hero{padding-block:clamp(18px,3vw,34px)}
.hero__g{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:920px){.hero__g{grid-template-columns:1.62fr 1fr}}
.hero__a{min-height:clamp(400px,58vh,600px)}
.hero__h{font-size:clamp(34px,5.2vw,74px);line-height:1;max-width:13ch}
.hero__h i{font-style:italic}
.hero__sub{font-size:clamp(14.5px,1.4vw,16.5px);line-height:1.72;color:rgba(243,240,233,.76);max-width:40ch;margin-top:16px}
.hero__b{display:grid;gap:10px;grid-template-rows:1fr 1fr}
.stat{min-height:170px}
.stat__n{font-family:var(--m);font-weight:500;font-size:clamp(40px,5.4vw,62px);letter-spacing:-.04em;line-height:.9}

/* ── gallery ── */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-block:clamp(30px,4.6vw,58px) 16px}
.sec h2{font-size:clamp(23px,2.8vw,34px)}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(258px,100%),1fr))}
.sp2{grid-column:span 2}.sp2r{grid-row:span 2}
@media (max-width:620px){.sp2{grid-column:span 1}}
.fil{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.fil button{font-family:var(--m);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);
  background:var(--pan);padding:9px 14px;border-radius:999px;transition:background .25s,color .25s}
.fil button:hover{color:var(--bone)}
.fil button[aria-pressed="true"]{background:var(--bone);color:var(--void)}

/* ── dossier ── */
.ds{padding-block:clamp(22px,3.4vw,44px)}
.ds__back{display:inline-flex;gap:8px;margin-bottom:22px}
.ds__h{font-size:clamp(34px,6vw,84px);line-height:.98;max-width:15ch}
.ds__l{font-size:clamp(16px,1.8vw,21px);line-height:1.6;color:var(--dim);max-width:52ch;margin-top:18px}
.ds__meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(112px,100%),1fr));gap:6px;margin-top:26px}
.mi{background:var(--pan);border-radius:11px;padding:14px}
.mi b{display:block;font-family:var(--m);font-weight:500;font-size:15px;margin-top:6px;letter-spacing:-.01em}
.ds__plate{position:relative;height:clamp(230px,38vw,420px);border-radius:var(--r);overflow:hidden;margin-block:clamp(18px,2.6vw,32px)}
.blk{padding-block:clamp(22px,3.2vw,40px);border-top:1px solid rgba(243,240,233,.07)}
.pr{display:grid;gap:clamp(20px,3vw,46px);grid-template-columns:1fr}
@media (min-width:900px){.pr{grid-template-columns:190px 1fr}}
.pr p{color:var(--dim);line-height:1.8;max-width:64ch;font-size:15.5px}
.pr p+p{margin-top:15px}
.pr b{color:var(--bone);font-weight:600}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(124px,100%),1fr));gap:6px;margin-top:22px}
.fg{background:var(--pan);border-radius:11px;padding:16px}
.fg b{display:block;font-family:var(--m);font-weight:500;font-size:26px;letter-spacing:-.03em;margin-top:8px}
.ls{display:grid;grid-template-columns:26px 1fr;gap:14px;padding-block:14px;border-bottom:1px solid rgba(243,240,233,.07)}
.ls span{font-family:var(--m);font-size:10px;color:var(--red);padding-top:4px}
.ls p{color:var(--dim);line-height:1.75}

/* ── index rows ── */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:3ch 1fr auto;gap:16px;align-items:baseline;padding-block:15px;width:100%;
  border-bottom:1px solid rgba(243,240,233,.07);transition:padding-left .4s var(--e),color .25s}
.row:hover{padding-left:11px}
.row b{font-family:var(--s);font-weight:400;font-size:clamp(18px,2.1vw,24px);letter-spacing:-.01em}
.row--g b,.row--g .m{color:var(--red)}

/* ── foot ── */
.ft{border-top:1px solid var(--line);margin-top:clamp(36px,5vw,72px);background:var(--wall)}
.ft__g{display:grid;gap:26px;grid-template-columns:1fr;padding-block:clamp(30px,4.4vw,52px)}
@media (min-width:840px){.ft__g{grid-template-columns:1.7fr 1fr 1fr 1fr}}
.ft h4{font-family:var(--m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);
  font-weight:400;margin-bottom:13px}
.ft li{margin-bottom:8px}
.ft li button{font-size:14px;color:var(--dim);transition:color .22s}
.ft li button:hover{color:var(--bone)}
.ft__b{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;padding-block:16px 36px;
  border-top:1px solid rgba(243,240,233,.07)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.up{opacity:1;transform:none}}
</style>

    // deep ground
    var gg = c.createLinearGradient(0,0,w*0.6,h);
    gg.addColorStop(0, col(2,1)); gg.addColorStop(1, col(3,1));
    c.fillStyle = gg; c.fillRect(0,0,w,h);
    // soft masses, large and overlapping
    for (var i=0;i<5;i++){
      var cx=r()*w, cy=r()*h, rad=(0.42+r()*0.6)*Math.max(w,h);
      var g2=c.createRadialGradient(cx,cy,0,cx,cy,rad);
      g2.addColorStop(0, col(i%2, 0.55+r()*0.35));
      g2.addColorStop(0.55, col(1, 0.22));
      g2.addColorStop(1, col(3,0));
      c.fillStyle=g2; c.fillRect(0,0,w,h);
    }
    // one bright core
    var bx=r()*w*0.8+w*0.1, by=r()*h*0.6+h*0.1;
    var g3=c.createRadialGradient(bx,by,0,bx,by,Math.max(w,h)*0.34);
    g3.addColorStop(0, col(0,0.72)); g3.addColorStop(1, col(0,0));
    c.fillStyle=g3; c.fillRect(0,0,w,h);
    // settle the edges
    var v=c.createRadialGradient(w/2,h*0.44,0,w/2,h*0.44,Math.max(w,h)*0.78);
    v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.58)");
    c.fillStyle=v; c.fillRect(0,0,w,h);
  }

  function render(route, arg){
    app.innerHTML = "<div>" + (route==="unit" ? V.unit(arg) : (V[route]||V.home)()) + foot() + "</div>";

  /* reveal + light + progress */
  function mark(){
    [].slice.call(document.querySelectorAll("[data-rv],.up")).forEach(function(n){
      var r = n.getBoundingClientRect();
      if (r.top < innerHeight*0.9 && r.bottom > -100) n.classList.add("rv");
    });
  }
  addEventListener("scroll", function(){
    mark();
    var max = document.body.scrollHeight - innerHeight;
    document.getElementById("prog").style.width = (max>0 ? scrollY/max*100 : 0).toFixed(2)+"%";
  }, { passive:true });

  document.addEventListener("pointermove", function(e){
    var p = e.target.closest && e.target.closest(".po");
    if (!p) return;
    var r = p.getBoundingClientRect();
    p.style.setProperty("--mx", (e.clientX-r.left)+"px");
    p.style.setProperty("--my", (e.clientY-r.top)+"px");
  }, { passive:true });

  document.addEventListener("click", function(e){
    var g = e.target.closest("[data-go]"); if (g){ render(g.getAttribute("data-go")); return; }
    var u = e.target.closest("[data-unit]"); if (u){ render("unit", u.getAttribute("data-unit")); }
